<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>正在生成救援协议 / Final Rescue OS</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page page-loading">
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换主题" title="切换深色/浅色模式">☀</button>
  <div class="noise"></div>

  <main class="loading-shell">
    <section class="loading-card reveal">
      <div class="radar-loader" aria-hidden="true">
        <span class="radar-ring"></span>
        <span class="radar-ring two"></span>
        <span class="radar-line"></span>
        <span class="radar-core"></span>
      </div>
      <p class="eyebrow">Generating Survival Protocol</p>
      <h1>正在定位你的期末风险区</h1>
      <p id="loadingText">正在匹配高频题型</p>
      <p id="slowTip" class="slow-tip hidden">后端响应较慢，超过 10 秒会自动使用前端 mockAnalyze 兜底。</p>
      <div class="loading-steps" aria-hidden="true">
        <span>风险区</span>
        <span>高频题型</span>
        <span>生存协议</span>
        <span>删除低收益</span>
        <span>上岸通道</span>
      </div>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="app.js"></script>
</body>
</html>
